
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bong County Third Division League Table | Bong Sports Network</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Bong Sports Network</h1>
        <p>The Home of Bong County Sports</p>
    </header>

    <main class="league-container">

        <h2>LFA Bong Sub-Association 3rd Division League</h2>
        <h3>2026/2027 Season - League Table</h3>

        <p id="tableMessage">Loading league table...</p>

        <div class="table-responsive">
            <table class="league-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Club</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>Pts</th>
                    </tr>
                </thead>

                <tbody id="leagueTableBody">
                    <tr>
                        <td colspan="10">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script type="module" src="league-table.js"></script>

</body>
</html>

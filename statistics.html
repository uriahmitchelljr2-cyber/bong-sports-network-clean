
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Statistics | Bong Sports Network</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Bong Sports Network</h1>
        <p>Player Statistics</p>
    </header>

    <main class="section">

        <h2>Player Statistics</h2>

        <p>Explore player performances across competitions and seasons.</p>

        <input
            type="text"
            id="searchStatistics"
            placeholder="Search by player name"
        >

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Club Team</th>
                        <th>Club Logo</th>
                        <th>Season</th>
                        <th>Apps</th>
                        <th>Goals</th>
                    </tr>
                </thead>

                <tbody id="statisticsTable">
                    <tr>
                        <td colspan="6">Loading statistics...</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

    <script type="module" src="statistics.js"></script>

</body>
</html>
